name: Refresh Raw_GL Cache

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Fetch Raw_GL from Apps Script and save as JSON
        run: |
          curl -s "https://script.google.com/macros/s/AKfycbzPgYiugeBKViYztqDIYSx8qmE3WQp58jd2x5jIcjPAnrLU9cXupYx09Hdsa272c6CZ/exec?action=getSheet&name=Raw_GL" -o raw_gl_cache.json

      - name: Commit and push if the data actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_gl_cache.json
          git diff --staged --quiet || git commit -m "Auto-refresh Raw_GL cache"
          git push
